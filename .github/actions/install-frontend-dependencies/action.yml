name: Install and build the frontend
description: Set up Node.js, install frontend dependencies and optionally build browser assets
inputs:
  build-frontend:
    description: Whether to bundle the browser assets after installing dependencies
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm
    - run: npm ci --ignore-scripts
      shell: bash
    - if: inputs.build-frontend == 'true'
      run: npm run build
      shell: bash
