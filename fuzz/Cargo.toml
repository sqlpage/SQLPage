[package]
name = "sqlpage-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sqlpage = { path = "..", features = ["odbc-static"] }
sqlx = { package = "sqlx-core-oldapi", version = "0.6.59", default-features = false, features = ["any"] }

[[bin]]
name = "sql_file"
path = "fuzz_targets/sql_file.rs"
test = false
doc = false
bench = false

[workspace]
